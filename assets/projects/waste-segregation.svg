<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wasteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2" />
      <stop offset="50%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#ECE3D7" />
    </linearGradient>

    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="100%" stop-color="#1B140F" />
    </linearGradient>

    <pattern id="wasteGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>

    <style>
      .blink-waste {{
        animation: blinkW 2s infinite ease-in-out;
      }}
      @keyframes blinkW {{
        0%, 100% {{ opacity: 1; }}
        50% {{ opacity: 0.35; }}
      }}
    </style>
  </defs>

  <rect width="920" height="400" rx="16" fill="url(#wasteBg)" />
  <rect width="920" height="400" rx="16" fill="url(#wasteGrid)" />
  <rect x="1" y="1" width="918" height="398" rx="15" fill="none" stroke="#D8CEBD" stroke-width="1.2" />

  <!-- Top Bar -->
  <g transform="translate(32, 24)">
    <text x="0" y="15" fill="#7A685A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📁 RAHULHAS / WASTE-SEGREGATION</text>
    <rect x="250" y="2" width="60" height="18" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
    <text x="280" y="15" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Public</text>

    <circle cx="840" cy="11" r="3.5" fill="#7A9A6D" class="blink-waste" />
    <text x="852" y="15" fill="#4B663F" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">ACTIVE</text>
  </g>
  <line x1="32" y1="52" x2="888" y2="52" stroke="#D5C8B8" stroke-width="1" />

  <!-- LEFT: Problem, Solution, Capabilities -->
  <g transform="translate(32, 70)">
    <text x="0" y="24" fill="#231A14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Waste Segregation</text>
    <text x="0" y="48" fill="#6A594C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Automated AI-driven waste classification &amp; stream-sorting pipeline</text>

    <!-- Problem Box -->
    <g transform="translate(0, 66)">
      <rect width="480" height="52" rx="8" fill="#FDFBF7" stroke="#D8CEBD" stroke-width="1" />
      <text x="14" y="20" fill="#B34033" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">&gt; PROBLEM:</text>
      <text x="14" y="38" fill="#4A3C32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Inefficient manual sorting leading to municipal recycling contamination.</text>
    </g>

    <!-- Solution Box -->
    <g transform="translate(0, 128)">
      <rect width="480" height="52" rx="8" fill="#FDFBF7" stroke="#88A57B" stroke-width="1" />
      <text x="14" y="20" fill="#4B663F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">&gt; SOLUTION:</text>
      <text x="14" y="38" fill="#4A3C32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">AI vision pipeline with real-time multi-category material detection.</text>
    </g>

    <!-- Tags / Capabilities -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
      <text x="37" y="16" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Python</text>

      <rect x="85" y="0" width="145" height="24" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
      <text x="157" y="16" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Machine Learning</text>

      <rect x="240" y="0" width="85" height="24" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
      <text x="282" y="16" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">OpenCV</text>

      <rect x="335" y="0" width="145" height="24" rx="4" fill="#FAF6F0" stroke="#D8CEBD" stroke-width="0.8" />
      <text x="407" y="16" text-anchor="middle" fill="#5A4A3E" font-family="'JetBrains Mono', monospace" font-size="10">Multi-Class Vision</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 260)">
      <rect width="130" height="32" rx="6" fill="#241B15" stroke="#4A392D" stroke-width="1" />
      <text x="65" y="20" text-anchor="middle" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">▶ View Code</text>

      <rect x="142" y="0" width="130" height="32" rx="6" fill="#EFE8DD" stroke="#88A57B" stroke-width="1" />
      <text x="207" y="20" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">☁ Live Demo</text>
    </g>
  </g>

  <!-- RIGHT: Espresso Camera Scanner HUD Preview -->
  <g transform="translate(560, 75)">
    <rect width="325" height="280" rx="14" fill="url(#hudBg)" stroke="#4A392D" stroke-width="1" />
    <rect x="0" y="0" width="325" height="26" rx="14" fill="#1B140F" />
    <text x="14" y="17" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">INSPECTION_HUD // CAMERA_FEED_01</text>
    <text x="310" y="17" text-anchor="end" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="9.5">FPS: 48</text>
    <line x1="0" y1="26" x2="325" y2="26" stroke="#3D3027" stroke-width="0.8" />

    <!-- Scanner Target -->
    <g transform="translate(25, 40)">
      <rect width="275" height="145" rx="6" fill="#160F0B" stroke="#3D3027" stroke-width="0.8" />
      <rect x="55" y="25" width="165" height="92" rx="4" fill="#7A9A6D" fill-opacity="0.1" stroke="#7A9A6D" stroke-width="1.2" stroke-dasharray="4 4" />
      <rect x="55" y="12" width="140" height="16" rx="2" fill="#7A9A6D" />
      <text x="60" y="24" fill="#1C1510" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">RECYCLABLE [CONF: 98.4%]</text>

      <line x1="137" y1="67" x2="137" y2="75" stroke="#7A9A6D" stroke-width="1.5" />
      <line x1="133" y1="71" x2="141" y2="71" stroke="#7A9A6D" stroke-width="1.5" />
    </g>

    <!-- Bottom Tagline in HUD -->
    <g transform="translate(25, 215)">
      <text x="0" y="14" fill="#88A57B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">● REAL_TIME_CLASSIFIER: VERIFIED</text>
      <text x="0" y="36" fill="#D5C8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-style="italic">"Reduce waste. Build a cleaner tomorrow. 🌱"</text>
    </g>
  </g>
</svg>