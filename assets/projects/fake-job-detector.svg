<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="jobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2" />
      <stop offset="50%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#ECE3D7" />
    </linearGradient>

    <linearGradient id="jobHud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="100%" stop-color="#1B140F" />
    </linearGradient>

    <pattern id="jobGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="860" height="320" rx="14" fill="url(#jobBg)" />
  <rect width="860" height="320" rx="14" fill="url(#jobGrid)" />
  <rect x="1" y="1" width="858" height="318" rx="13" fill="none" stroke="#D8CEBD" stroke-width="1.2" />

  <!-- Top Bar -->
  <g transform="translate(28, 20)">
    <text x="0" y="15" fill="#7A685A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📁 RAHULHAS / FAKE-JOB-DETECTOR</text>
    <rect x="250" y="2" width="60" height="18" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
    <text x="280" y="15" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Public</text>

    <text x="804" y="15" text-anchor="end" fill="#5F8050" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">● FRAUD_GUARD_ACTIVE</text>
  </g>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#D5C8B8" stroke-width="1" />

  <!-- LEFT: Title, Description, Stack -->
  <g transform="translate(28, 62)">
    <text x="0" y="22" fill="#231A14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Fake Job Posting Detector</text>
    <text x="0" y="42" fill="#5E4E42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">AI model to detect and flag suspicious job postings &amp; recruitment scams.</text>

    <!-- Verified Stack Badges -->
    <g transform="translate(0, 56)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
      <text x="37" y="15" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Python</text>

      <rect x="83" y="0" width="105" height="22" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
      <text x="135" y="15" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Scikit-learn</text>

      <rect x="196" y="0" width="65" height="22" rx="4" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="0.8" />
      <text x="228" y="15" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">NLP</text>

      <!-- Row 2 -->
      <rect x="0" y="28" width="85" height="22" rx="4" fill="#FAF6F0" stroke="#D8CEBD" stroke-width="0.8" />
      <text x="42" y="43" text-anchor="middle" fill="#5A4A3E" font-family="'JetBrains Mono', monospace" font-size="10">Next.js 14</text>

      <rect x="93" y="28" width="85" height="22" rx="4" fill="#FAF6F0" stroke="#D8CEBD" stroke-width="0.8" />
      <text x="135" y="43" text-anchor="middle" fill="#5A4A3E" font-family="'JetBrains Mono', monospace" font-size="10">TypeScript</text>

      <rect x="186" y="28" width="65" height="22" rx="4" fill="#FAF6F0" stroke="#D8CEBD" stroke-width="0.8" />
      <text x="218" y="43" text-anchor="middle" fill="#5A4A3E" font-family="'JetBrains Mono', monospace" font-size="10">Redis</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 150)">
      <rect width="115" height="28" rx="5" fill="#241B15" stroke="#4A392D" stroke-width="1" />
      <text x="57" y="18" text-anchor="middle" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">▶ View Code</text>
    </g>
  </g>

  <!-- RIGHT: Security HUD -->
  <g transform="translate(535, 62)">
    <rect width="295" height="225" rx="10" fill="url(#jobHud)" stroke="#4A392D" stroke-width="1" />
    <rect x="0" y="0" width="295" height="24" rx="10" fill="#1C1510" />
    <text x="12" y="16" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">RISK_DETECTION // TELEMETRY</text>
    <line x1="0" y1="24" x2="295" y2="24" stroke="#3D3027" stroke-width="0.8" />

    <!-- Risk Box -->
    <g transform="translate(16, 36)">
      <rect width="260" height="52" rx="6" fill="#17100B" stroke="#B34033" stroke-width="0.8" />
      <text x="14" y="20" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="8.5">FRAUD_RISK_INDEX</text>
      <text x="14" y="38" fill="#E26D5C" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">94.8% RED_FLAG</text>
      <rect x="160" y="18" width="86" height="18" rx="4" fill="#B34033" fill-opacity="0.2" stroke="#B34033" stroke-width="0.5" />
      <text x="168" y="31" fill="#F3A399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SUSPICIOUS</text>
    </g>

    <!-- Lexical Analysis -->
    <g transform="translate(16, 100)">
      <text x="0" y="10" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="9.5">Lexical Anomaly Score</text>
      <text x="260" y="10" text-anchor="end" fill="#88A57B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">88.5%</text>
      <rect x="0" y="16" width="260" height="5" rx="2" fill="#150F0A" />
      <rect x="0" y="16" width="230" height="5" rx="2" fill="#7A9A6D" />
    </g>

    <!-- Bottom Tagline -->
    <g transform="translate(16, 150)">
      <text x="0" y="16" fill="#D5C8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-style="italic">"Think. Verify. Apply safely. 🌱"</text>
    </g>
  </g>
</svg>