  <!-- RIGHT: Reasoning Vectors HUD -->
  <g transform="translate(535, 62)">
    <rect width="295" height="225" rx="10" fill="url(#debateGlass)" stroke="#22D3EE" stroke-width="0.6" stroke-opacity="0.3" />
    <rect x="0" y="0" width="295" height="24" rx="10" fill="#0E1B38" />
    <text x="12" y="16" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">RHETORICAL_ANALYSIS // VECTORS</text>
    <line x1="0" y1="24" x2="295" y2="24" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.2" />

    <!-- Vector 1: Logos -->
    <g transform="translate(16, 42)">
      <text x="0" y="10" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">LOGOS (Logic)</text>
      <text x="260" y="10" text-anchor="end" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">92%</text>
      <rect x="0" y="16" width="260" height="6" rx="2" fill="#1E293B" />
      <rect x="0" y="16" width="240" height="6" rx="2" fill="#22D3EE" />
    </g>

    <!-- Vector 2: Ethos -->
    <g transform="translate(16, 78)">
      <text x="0" y="10" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ETHOS (Credibility)</text>
      <text x="260" y="10" text-anchor="end" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">88%</text>
      <rect x="0" y="16" width="260" height="6" rx="2" fill="#1E293B" />
      <rect x="0" y="16" width="228" height="6" rx="2" fill="#38BDF8" />
    </g>

    <!-- Vector 3: Pathos -->
    <g transform="translate(16, 114)">
      <text x="0" y="10" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">PATHOS (Emotion)</text>
      <text x="260" y="10" text-anchor="end" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">81%</text>
      <rect x="0" y="16" width="260" height="6" rx="2" fill="#1E293B" />
      <rect x="0" y="16" width="210" height="6" rx="2" fill="#67E8F9" />
    </g>

    <!-- Fallacy Detection Pill -->
    <g transform="translate(16, 150)">
      <rect width="260" height="36" rx="6" fill="#070D1A" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="14" cy="18" r="3.5" fill="#10B981" />
      <text x="26" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">FALLACY_CHECK:</text>
      <text x="26" y="29" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">0 CRITICAL FALLACIES DETECTED</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 2 16 L 2 2 L 16 2" fill="none" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M 858 16 L 858 2 L 844 2" fill="none" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M 2 304 L 2 318 L 16 318" fill="none" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M 858 304 L 858 318 L 844 318" fill="none" stroke="#38BDF8" stroke-width="1.8" />
</svg>