  <g transform="translate(28, 62)">
    <text x="0" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">AI Debate Coach</text>
    <text x="0" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Real-time dialectic platform evaluating speech patterns, rhetorical logic, and persuasion.</text>

    <!-- Verified Tech Stack Badges -->
    <g transform="translate(0, 58)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1">VERIFIED_STACK:</text>
      <g transform="translate(0, 20)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="70" height="22" rx="4" fill="#0B132B" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">React</text>

        <rect x="76" y="0" width="55" height="22" rx="4" fill="#0B132B" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" transform="translate(76, 0)" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">Vite</text>

        <rect x="137" y="0" width="95" height="22" rx="4" fill="#0B132B" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" transform="translate(137, 0)" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">Tailwind CSS</text>

        <rect x="238" y="0" width="85" height="22" rx="4" fill="#0B132B" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" transform="translate(238, 0)" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">TypeScript</text>

        <!-- Row 2 -->
        <rect x="0" y="28" width="75" height="22" rx="4" fill="#0B132B" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" transform="translate(0, 28)" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">FastAPI</text>

        <rect x="81" y="28" width="70" height="22" rx="4" fill="#0B132B" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" transform="translate(81, 28)" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">Python</text>

        <rect x="157" y="28" width="140" height="22" rx="4" fill="#0B132B" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.5" />
        <text x="8" y="15" transform="translate(157, 28)" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Gemini 1.5 Flash</text>

        <rect x="303" y="28" width="75" height="22" rx="4" fill="#0B132B" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.4" />
        <text x="8" y="15" transform="translate(303, 28)" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">Uvicorn</text>
