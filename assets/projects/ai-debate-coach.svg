<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="debateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A16" />
      <stop offset="60%" stop-color="#0A142E" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <linearGradient id="debateGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1C38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#081124" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="debateGlow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060A16" stop-opacity="0" />
    </radialGradient>

    <pattern id="debGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#38BDF8" fill-opacity="0.06" />
    </pattern>

    <style>
      .blink-deb {
        animation: blinkD 2.5s infinite ease-in-out;
      }
      @keyframes blinkD {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <rect width="860" height="320" rx="14" fill="url(#debateBg)" />
  <rect width="860" height="320" rx="14" fill="url(#debateGlow)" />
  <rect width="860" height="320" rx="14" fill="url(#debGrid)" />

  <rect x="1" y="1" width="858" height="318" rx="13" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Header -->
  <g transform="translate(28, 20)">
    <rect width="135" height="22" rx="4" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.5" />
    <circle cx="10" cy="11" r="3" fill="#38BDF8" class="blink-deb" />
    <text x="18" y="15" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SUPPORTING_PROJECT // 02</text>
    <text x="150" y="15" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">DIALECTIC_REASONING_ENGINE</text>
    <text x="804" y="15" text-anchor="end" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="10">● GEMINI 1.5 FLASH</text>
  </g>
  <line x1="28" y1="46" x2="832" y2="46" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.2" />

