      <rect width="115" height="28" rx="5" fill="#0284C7" fill-opacity="0.2" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="57" y="18" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">&gt; SOURCE</text>

      <rect x="125" y="0" width="115" height="28" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.3" />
      <text x="182" y="18" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">&gt; DOCS</text>
    </g>
