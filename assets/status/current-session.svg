<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sessionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A16" />
      <stop offset="60%" stop-color="#0A132B" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <linearGradient id="sessionGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="sessionGlow" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060A16" stop-opacity="0" />
    </radialGradient>

    <pattern id="sessGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#38BDF8" fill-opacity="0.08" />
    </pattern>

    <style>
      .blink {
        animation: blinkAnim 2s infinite ease-in-out;
      }
      .cursor-blink {
        animation: cursorAnim 1s infinite step-start;
      }
      @keyframes blinkAnim {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.9); }
      }
      @keyframes cursorAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Panel Base -->
  <rect width="860" height="260" rx="16" fill="url(#sessionBg)" />
  <rect width="860" height="260" rx="16" fill="url(#sessionGlow)" />
  <rect width="860" height="260" rx="16" fill="url(#sessGrid)" />

  <!-- Borders -->
  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" />
  <rect x="5" y="5" width="850" height="250" rx="11" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.1" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4.5" fill="#EF4444" fill-opacity="0.7" />
    <circle cx="24" cy="6" r="4.5" fill="#F59E0B" fill-opacity="0.7" />
    <circle cx="42" cy="6" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="64" y="10" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="1.5">RAHUL.DEV / CURRENT_SESSION</text>
    <text x="812" y="10" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">CONSOLE_ID: #0X884</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#22D3EE" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Terminal Body Glass Container -->
  <rect x="24" y="56" width="812" height="180" rx="10" fill="url(#sessionGlass)" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Prompt Lines -->
  <!-- Line 1: focus -->
  <g transform="translate(48, 86)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">focus</text>
    <text x="140" y="0" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13">AI + Full-Stack</text>
  </g>

  <!-- Line 2: mode -->
  <g transform="translate(48, 116)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">mode</text>
    <text x="140" y="0" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">building</text>
  </g>

  <!-- Line 3: interests -->
  <g transform="translate(48, 146)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">interests</text>
    <text x="140" y="0" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="13">AI products • web experiences</text>
  </g>

  <!-- Line 4: mindset -->
  <g transform="translate(48, 176)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">mindset</text>
    <text x="140" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">learn → build → improve</text>
  </g>

  <!-- Line 5: status -->
  <g transform="translate(48, 206)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">status</text>
    <circle cx="148" cy="-4" r="4.5" fill="#10B981" class="blink" />
    <text x="160" y="0" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">ONLINE</text>
    <rect x="235" y="-12" width="7" height="15" fill="#22D3EE" class="cursor-blink" />
  </g>

  <!-- Right Side Visual Signal Bar -->
  <g transform="translate(680, 80)">
    <rect width="130" height="130" rx="8" fill="#0E172A" fill-opacity="0.6" stroke="#22D3EE" stroke-width="0.6" stroke-opacity="0.3" />
    <text x="14" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1">TELEMETRY_FEED</text>
    <!-- Waveform / Mini Signal Bars -->
    <rect x="16" y="90" width="8" height="24" rx="2" fill="#22D3EE" fill-opacity="0.4" />
    <rect x="28" y="74" width="8" height="40" rx="2" fill="#22D3EE" fill-opacity="0.6" />
    <rect x="40" y="58" width="8" height="56" rx="2" fill="#22D3EE" fill-opacity="0.8" />
    <rect x="52" y="82" width="8" height="32" rx="2" fill="#38BDF8" fill-opacity="0.5" />
    <rect x="64" y="44" width="8" height="70" rx="2" fill="#38BDF8" fill-opacity="0.9" />
    <rect x="76" y="68" width="8" height="46" rx="2" fill="#38BDF8" fill-opacity="0.7" />
    <rect x="88" y="52" width="8" height="62" rx="2" fill="#67E8F9" fill-opacity="0.85" />
    <rect x="100" y="38" width="8" height="76" rx="2" fill="#22D3EE" fill-opacity="1" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <path d="M 858 20 L 858 2 L 840 2" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <path d="M 2 240 L 2 258 L 20 258" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <path d="M 858 240 L 858 258 L 840 258" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
</svg>