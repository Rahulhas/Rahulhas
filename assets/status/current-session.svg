<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Deep Espresso Brown -->
    <linearGradient id="sessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281E17" />
      <stop offset="60%" stop-color="#241C15" />
      <stop offset="100%" stop-color="#1B140F" />
    </linearGradient>

    <!-- Glass card container -->
    <linearGradient id="sessGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342820" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#201712" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="sessGridPattern" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>

    <style>
      .blink-sess {
        animation: blinkSessAnim 2s infinite ease-in-out;
      }
      .cursor-blink {
        animation: cursorAnim 1s infinite step-start;
      }
      @keyframes blinkSessAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes cursorAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="860" height="260" rx="16" fill="url(#sessBg)" />
  <rect width="860" height="260" rx="16" fill="url(#sessGridPattern)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#4D3B2F" stroke-width="1" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4.5" fill="#E26D5C" />
    <circle cx="24" cy="6" r="4.5" fill="#E8B04C" />
    <circle cx="42" cy="6" r="4.5" fill="#7A9A6D" />
    <text x="64" y="10" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">RAHUL.DEV / CURRENT_SESSION</text>
    <text x="812" y="10" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">KERNEL_ONLINE</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#4A392D" stroke-width="1" />

  <!-- Terminal Body Glass Container -->
  <rect x="24" y="56" width="812" height="180" rx="10" fill="url(#sessGlass)" stroke="#3E2E23" stroke-width="0.8" />

  <!-- Prompt Rows in Sage Green &amp; Sand Beige -->
  <!-- Line 1: focus -->
  <g transform="translate(48, 86)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">focus</text>
    <text x="140" y="0" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="13">AI + Full-Stack</text>
  </g>

  <!-- Line 2: mode -->
  <g transform="translate(48, 116)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">mode</text>
    <text x="140" y="0" fill="#D5C8B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">building</text>
  </g>

  <!-- Line 3: interests -->
  <g transform="translate(48, 146)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">interests</text>
    <text x="140" y="0" fill="#EAE1D3" font-family="'JetBrains Mono', monospace" font-size="13">AI products • web experiences</text>
  </g>

  <!-- Line 4: mindset -->
  <g transform="translate(48, 176)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">mindset</text>
    <text x="140" y="0" fill="#B8A796" font-family="'JetBrains Mono', monospace" font-size="13">learn → build → improve</text>
  </g>

  <!-- Line 5: status -->
  <g transform="translate(48, 206)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">status</text>
    <circle cx="148" cy="-4" r="4.5" fill="#79B464" class="blink-sess" />
    <text x="160" y="0" fill="#88C473" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">ONLINE</text>
    <rect x="235" y="-12" width="7" height="15" fill="#7A9A6D" class="cursor-blink" />
  </g>

  <!-- Right Visual Consistency Frequency Meter in Sage Green -->
  <g transform="translate(680, 80)">
    <rect width="130" height="130" rx="8" fill="#1C1510" stroke="#4A392D" stroke-width="0.8" />
    <text x="14" y="24" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">CONSISTENCY SCORE</text>
    <!-- Waveform / Equalizer Bars -->
    <rect x="16" y="90" width="8" height="24" rx="2" fill="#5F8050" />
    <rect x="28" y="74" width="8" height="40" rx="2" fill="#7A9A6D" />
    <rect x="40" y="58" width="8" height="56" rx="2" fill="#88A57B" />
    <rect x="52" y="82" width="8" height="32" rx="2" fill="#7A9A6D" />
    <rect x="64" y="44" width="8" height="70" rx="2" fill="#9DC28E" />
    <rect x="76" y="68" width="8" height="46" rx="2" fill="#88A57B" />
    <rect x="88" y="52" width="8" height="62" rx="2" fill="#9DC28E" />
    <rect x="100" y="38" width="8" height="76" rx="2" fill="#B4D9A5" />
  </g>
</svg>