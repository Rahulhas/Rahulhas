<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A16" />
      <stop offset="60%" stop-color="#0A132B" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <linearGradient id="gitGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="gitGlow" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060A16" stop-opacity="0" />
    </radialGradient>

    <pattern id="gitGridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#38BDF8" fill-opacity="0.08" />
    </pattern>

    <style>
      .blink-git {
        animation: blinkG 2s infinite ease-in-out;
      }
      @keyframes blinkG {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <rect width="860" height="260" rx="16" fill="url(#gitBg)" />
  <rect width="860" height="260" rx="16" fill="url(#gitGlow)" />
  <rect width="860" height="260" rx="16" fill="url(#gitGridPattern)" />

  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4.5" fill="#EF4444" fill-opacity="0.7" />
    <circle cx="24" cy="6" r="4.5" fill="#F59E0B" fill-opacity="0.7" />
    <circle cx="42" cy="6" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="64" y="10" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="1.5">GITHUB_ACTIVITY / RAHULHAS</text>
    <text x="812" y="10" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">BRANCH: MAIN // PRODUCTION</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#22D3EE" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Terminal Body Glass Container -->
  <rect x="24" y="56" width="812" height="180" rx="10" fill="url(#gitGlass)" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Command Rows -->
  <!-- Line 1: profile -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">profile</text>
    <text x="180" y="0" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13">@Rahulhas</text>
  </g>

  <!-- Line 2: focus -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">focus</text>
    <text x="180" y="0" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="13">AI + Full-Stack</text>
  </g>

  <!-- Line 3: development -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">development</text>
    <circle cx="188" cy="-4" r="4.5" fill="#10B981" class="blink-git" />
    <text x="200" y="0" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">ACTIVE</text>
  </g>

  <!-- Line 4: mode -->
  <g transform="translate(48, 194)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">mode</text>
    <text x="180" y="0" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">BUILDING</text>
  </g>

  <!-- Right Visual Commits Mini Timeline -->
  <g transform="translate(560, 75)">
    <rect width="250" height="142" rx="8" fill="#0B132B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.3" />
    <text x="14" y="22" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">ACTIVITY_PIPELINE</text>

    <!-- Node 1 -->
    <circle cx="20" cy="50" r="4" fill="#10B981" />
    <line x1="20" y1="54" x2="20" y2="76" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.5" />
    <text x="34" y="53" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9.5">feat: ai debate engine</text>

    <!-- Node 2 -->
    <circle cx="20" cy="80" r="4" fill="#38BDF8" />
    <line x1="20" y1="84" x2="20" y2="106" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.5" />
    <text x="34" y="83" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9.5">feat: job detector heuristics</text>

    <!-- Node 3 -->
    <circle cx="20" cy="110" r="4" fill="#22D3EE" />
    <text x="34" y="113" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="9.5">build: command center HUD</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#22D3EE" stroke-width="2" />
  <path d="M 858 20 L 858 2 L 840 2" fill="none" stroke="#22D3EE" stroke-width="2" />
  <path d="M 2 240 L 2 258 L 20 258" fill="none" stroke="#22D3EE" stroke-width="2" />
  <path d="M 858 240 L 858 258 L 840 258" fill="none" stroke="#22D3EE" stroke-width="2" />
</svg>