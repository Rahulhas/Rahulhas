<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Deep Espresso Brown -->
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281E17" />
      <stop offset="60%" stop-color="#241C15" />
      <stop offset="100%" stop-color="#1B140F" />
    </linearGradient>

    <linearGradient id="gitGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342820" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#201712" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="gitGridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>

    <style>
      .blink-git {{
        animation: blinkG 2s infinite ease-in-out;
      }}
      @keyframes blinkG {{
        0%, 100% {{ opacity: 1; }}
        50% {{ opacity: 0.35; }}
      }}
    </style>
  </defs>

  <rect width="860" height="260" rx="16" fill="url(#gitBg)" />
  <rect width="860" height="260" rx="16" fill="url(#gitGridPattern)" />
  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#4D3B2F" stroke-width="1" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4.5" fill="#E26D5C" />
    <circle cx="24" cy="6" r="4.5" fill="#E8B04C" />
    <circle cx="42" cy="6" r="4.5" fill="#7A9A6D" />
    <text x="64" y="10" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">GITHUB_ACTIVITY / RAHULHAS</text>
    <text x="812" y="10" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">BRANCH: MAIN // ACTIVE</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#4A392D" stroke-width="1" />

  <!-- Terminal Body Glass Container -->
  <rect x="24" y="56" width="812" height="180" rx="10" fill="url(#gitGlass)" stroke="#3E2E23" stroke-width="0.8" />

  <!-- Command Rows in Sage Green &amp; Sand Beige -->
  <!-- Line 1: profile -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">profile</text>
    <text x="180" y="0" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="13">@Rahulhas</text>
  </g>

  <!-- Line 2: focus -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">focus</text>
    <text x="180" y="0" fill="#EAE1D3" font-family="'JetBrains Mono', monospace" font-size="13">AI + Full-Stack</text>
  </g>

  <!-- Line 3: development -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">development</text>
    <circle cx="188" cy="-4" r="4.5" fill="#79B464" class="blink-git" />
    <text x="200" y="0" fill="#88C473" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">ACTIVE</text>
  </g>

  <!-- Line 4: mode -->
  <g transform="translate(48, 194)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">mode</text>
    <text x="180" y="0" fill="#D5C8B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">BUILDING</text>
  </g>

  <!-- Right Visual Histogram Bars -->
  <g transform="translate(560, 75)">
    <rect width="250" height="142" rx="8" fill="#1C1510" stroke="#4A392D" stroke-width="0.8" />
    <text x="14" y="22" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">ACTIVITY_PIPELINE</text>

    <!-- Node 1 -->
    <circle cx="20" cy="50" r="4" fill="#7A9A6D" />
    <line x1="20" y1="54" x2="20" y2="76" stroke="#4D3B2F" stroke-width="1" />
    <text x="34" y="53" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="9.5">feat: ai debate engine</text>

    <!-- Node 2 -->
    <circle cx="20" cy="80" r="4" fill="#88A57B" />
    <line x1="20" y1="84" x2="20" y2="106" stroke="#4D3B2F" stroke-width="1" />
    <text x="34" y="83" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="9.5">feat: job detector heuristics</text>

    <!-- Node 3 -->
    <circle cx="20" cy="110" r="4" fill="#79B464" />
    <text x="34" y="113" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="9.5">Code • Commit • Improve 🌱</text>
  </g>
</svg>