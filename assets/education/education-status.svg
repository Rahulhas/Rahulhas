<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2" />
      <stop offset="50%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#ECE3D7" />
    </linearGradient>

    <linearGradient id="eduCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#EFE8DE" />
    </linearGradient>

    <pattern id="eduGridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="860" height="260" rx="16" fill="url(#eduBg)" />
  <rect width="860" height="260" rx="16" fill="url(#eduGridPattern)" />
  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#D8CEBD" stroke-width="1.2" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <text x="0" y="12" fill="#241B15" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" letter-spacing="1.5">🎓 ACADEMIC_CREDENTIALS // EDUCATION</text>
    <text x="812" y="12" text-anchor="end" fill="#7A685A" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">STATUS: ENROLLED &amp; VERIFIED</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#D5C8B8" stroke-width="1" />

  <!-- Dual Degree Cards Container -->
  <!-- Card 1: MCA -->
  <g transform="translate(32, 60)">
    <rect width="380" height="175" rx="12" fill="url(#eduCard)" stroke="#D8CEBF" stroke-width="1.2" />

    <!-- Degree Title -->
    <text x="18" y="38" fill="#231A14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Master Of Computer Application</text>

    <!-- University -->
    <text x="18" y="64" fill="#6A594C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">KLE Technological University, Hubballi</text>

    <line x1="18" y1="84" x2="362" y2="84" stroke="#DDD2C2" stroke-width="1" />

    <!-- Timeline &amp; Badge -->
    <g transform="translate(18, 102)">
      <text x="0" y="24" fill="#7A685A" font-family="'JetBrains Mono', monospace" font-size="11">TIMELINE:</text>
      <text x="75" y="24" fill="#231A14" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">2025 — 2027</text>

      <rect x="270" y="6" width="70" height="28" rx="6" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="1" />
      <text x="305" y="25" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">MCA</text>
    </g>
  </g>

  <!-- Card 2: BCA -->
  <g transform="translate(448, 60)">
    <rect width="380" height="175" rx="12" fill="url(#eduCard)" stroke="#D8CEBF" stroke-width="1.2" />

    <!-- Degree Title -->
    <text x="18" y="38" fill="#231A14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Bachelor Of Computer Application</text>

    <!-- University / College -->
    <text x="18" y="64" fill="#6A594C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">BVVS Basaveshwar Science College, Bagalkot</text>

    <line x1="18" y1="84" x2="362" y2="84" stroke="#DDD2C2" stroke-width="1" />

    <!-- Timeline &amp; Badge -->
    <g transform="translate(18, 102)">
      <text x="0" y="24" fill="#7A685A" font-family="'JetBrains Mono', monospace" font-size="11">TIMELINE:</text>
      <text x="75" y="24" fill="#231A14" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">2022 — 2025</text>

      <rect x="270" y="6" width="70" height="28" rx="6" fill="#E4EDE0" stroke="#7A9A6D" stroke-width="1" />
      <text x="305" y="25" text-anchor="middle" fill="#3D5434" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">BCA</text>
    </g>
  </g>
</svg>