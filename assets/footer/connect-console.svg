<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A16" />
      <stop offset="60%" stop-color="#0A132B" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <linearGradient id="connGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65" />
    </linearGradient>

    <radialGradient id="connGlow" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060A16" stop-opacity="0" />
    </radialGradient>

    <pattern id="connGridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#38BDF8" fill-opacity="0.08" />
    </pattern>

    <style>
      .blink-conn {
        animation: blinkC 2s infinite ease-in-out;
      }
      @keyframes blinkC {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <rect width="860" height="260" rx="16" fill="url(#connBg)" />
  <rect width="860" height="260" rx="16" fill="url(#connGlow)" />
  <rect width="860" height="260" rx="16" fill="url(#connGridPattern)" />

  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4.5" fill="#EF4444" fill-opacity="0.7" />
    <circle cx="24" cy="6" r="4.5" fill="#F59E0B" fill-opacity="0.7" />
    <circle cx="42" cy="6" r="4.5" fill="#10B981" fill-opacity="0.8" />
    <text x="64" y="10" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="1.5">CONNECT_WITH_RAHUL // COMMS_GATEWAY</text>
    <text x="812" y="10" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">HANDSHAKE: LISTENING</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#22D3EE" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Terminal Body Glass Container -->
  <rect x="24" y="56" width="812" height="180" rx="10" fill="url(#connGlass)" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Contact Command Rows -->
  <!-- Line 1: github -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">github</text>
    <text x="160" y="0" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13">/Rahulhas</text>
  </g>

  <!-- Line 2: linkedin -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">linkedin</text>
    <text x="160" y="0" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13">/in/rahulhasalkar</text>
  </g>

  <!-- Line 3: email -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">email</text>
    <text x="160" y="0" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="13">rahulhasalkar.dev@gmail.com</text>
  </g>

  <!-- Line 4: status -->
  <g transform="translate(48, 194)">
    <text x="0" y="0" fill="#22D3EE" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">status</text>
    <circle cx="168" cy="-4" r="4.5" fill="#10B981" class="blink-conn" />
    <text x="180" y="0" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">OPEN TO BUILD &amp; COLLAB</text>
  </g>

  <!-- Right Visual Action Hub -->
  <g transform="translate(560, 75)">
    <rect width="250" height="142" rx="8" fill="#0B132B" fill-opacity="0.8" stroke="#22D3EE" stroke-width="0.6" stroke-opacity="0.3" />
    <text x="14" y="22" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">COMMS_DISPATCHER</text>

    <!-- Quick action visual pills -->
    <g transform="translate(14, 40)">
      <rect width="222" height="30" rx="6" fill="#0F172A" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="15" cy="15" r="3" fill="#22D3EE" />
      <text x="28" y="19" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">New Ideas &amp; Projects</text>
    </g>

    <g transform="translate(14, 80)">
      <rect width="222" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="15" cy="15" r="3" fill="#38BDF8" />
      <text x="28" y="19" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Engineering Roles</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#22D3EE" stroke-width="2" />
  <path d="M 858 20 L 858 2 L 840 2" fill="none" stroke="#22D3EE" stroke-width="2" />
  <path d="M 2 240 L 2 258 L 20 258" fill="none" stroke="#22D3EE" stroke-width="2" />
  <path d="M 858 240 L 858 258 L 840 258" fill="none" stroke="#22D3EE" stroke-width="2" />
</svg>