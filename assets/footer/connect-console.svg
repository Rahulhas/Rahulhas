<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281E17" />
      <stop offset="60%" stop-color="#241C15" />
      <stop offset="100%" stop-color="#1B140F" />
    </linearGradient>

    <linearGradient id="connGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342820" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#201712" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="connGridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>

    <style>
      .blink-conn {{
        animation: blinkC 2s infinite ease-in-out;
      }}
      @keyframes blinkC {{
        0%, 100% {{ opacity: 1; }}
        50% {{ opacity: 0.35; }}
      }}
    </style>
  </defs>

  <rect width="860" height="260" rx="16" fill="url(#connBg)" />
  <rect width="860" height="260" rx="16" fill="url(#connGridPattern)" />
  <rect x="1" y="1" width="858" height="258" rx="15" fill="none" stroke="#4D3B2F" stroke-width="1" />

  <!-- Terminal Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4.5" fill="#E26D5C" />
    <circle cx="24" cy="6" r="4.5" fill="#E8B04C" />
    <circle cx="42" cy="6" r="4.5" fill="#7A9A6D" />
    <text x="64" y="10" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">CONNECT_WITH_RAHUL // COMMS_GATEWAY</text>
    <text x="812" y="10" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">HANDSHAKE: READY</text>
  </g>
  <line x1="24" y1="44" x2="836" y2="44" stroke="#4A392D" stroke-width="1" />

  <!-- Terminal Body Glass Container -->
  <rect x="24" y="56" width="812" height="180" rx="10" fill="url(#connGlass)" stroke="#3E2E23" stroke-width="0.8" />

  <!-- Contact Command Rows -->
  <!-- Line 1: github -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">github</text>
    <text x="160" y="0" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="13">/Rahulhas</text>
  </g>

  <!-- Line 2: linkedin -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">linkedin</text>
    <text x="160" y="0" fill="#D5C8B8" font-family="'JetBrains Mono', monospace" font-size="13">/in/rahulhasalkar</text>
  </g>

  <!-- Line 3: email -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">email</text>
    <text x="160" y="0" fill="#EAE1D3" font-family="'JetBrains Mono', monospace" font-size="13">rahulhasalkar.dev@gmail.com</text>
  </g>

  <!-- Line 4: status -->
  <g transform="translate(48, 194)">
    <text x="0" y="0" fill="#7A9A6D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">&gt;</text>
    <text x="24" y="0" fill="#A8C39D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">status</text>
    <circle cx="168" cy="-4" r="4.5" fill="#79B464" class="blink-conn" />
    <text x="180" y="0" fill="#88C473" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">OPEN TO BUILD &amp; COLLAB</text>
  </g>

  <!-- Right Visual Action Hub with Quote -->
  <g transform="translate(560, 75)">
    <rect width="250" height="142" rx="8" fill="#1C1510" stroke="#4A392D" stroke-width="0.8" />
    <g transform="translate(16, 26)">
      <text x="0" y="16" fill="#D5C8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-style="italic">"Open to new</text>
      <text x="0" y="36" fill="#D5C8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-style="italic">opportunities,</text>
      <text x="0" y="56" fill="#D5C8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-style="italic">interesting ideas &amp;</text>
      <text x="0" y="76" fill="#D5C8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-style="italic">collaborations." 🌱</text>
    </g>
  </g>
</svg>