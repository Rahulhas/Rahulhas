<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Sand Beige -->
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2" />
      <stop offset="50%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#ECE4D8" />
    </linearGradient>

    <!-- Dark Espresso for Cards -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281F18" />
      <stop offset="100%" stop-color="#1E1611" />
    </linearGradient>

    <pattern id="techGridPattern" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7A9A6D" fill-opacity="0.1" />
    </pattern>

    <style>
      .flow-pulse-1 {{
        stroke-dasharray: 6 12;
        animation: flowDash 10s linear infinite;
      }}
      .flow-pulse-2 {{
        stroke-dasharray: 6 12;
        animation: flowDashRev 12s linear infinite;
      }}
      @keyframes flowDash {{
        0% {{ stroke-dashoffset: 180; }}
        100% {{ stroke-dashoffset: 0; }}
      }}
      @keyframes flowDashRev {{
        0% {{ stroke-dashoffset: 0; }}
        100% {{ stroke-dashoffset: 180; }}
      }}
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="18" fill="url(#techBg)" />
  <rect width="920" height="460" rx="18" fill="url(#techGridPattern)" />
  <rect x="1" y="1" width="918" height="458" rx="17" fill="none" stroke="#D8CEBD" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(36, 24)">
    <circle cx="4" cy="8" r="4" fill="#7A9A6D" />
    <text x="16" y="12" fill="#2D231B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" letter-spacing="1.5">TECH_ECOSYSTEM // ARCHITECTURAL_GRAPH</text>
    <text x="848" y="12" text-anchor="end" fill="#7A685A" font-family="'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1">TOPOLOGY: DISTRIBUTED_CORE</text>
  </g>
  <line x1="36" y1="44" x2="884" y2="44" stroke="#D5C8B8" stroke-width="1" />

  <!-- Visual Connections (Curved Lines from Center to 4 Quadrants) -->
  <!-- Top Left: AI / CODE -->
  <path d="M 370 200 C 300 180 260 140 210 130" fill="none" stroke="#D1C4B2" stroke-width="2.5" />
  <path d="M 370 200 C 300 180 260 140 210 130" fill="none" stroke="#7A9A6D" stroke-width="1.8" class="flow-pulse-1" />

  <!-- Top Right: WEB / UI -->
  <path d="M 550 200 C 620 180 660 140 710 130" fill="none" stroke="#D1C4B2" stroke-width="2.5" />
  <path d="M 550 200 C 620 180 660 140 710 130" fill="none" stroke="#7A9A6D" stroke-width="1.8" class="flow-pulse-2" />

  <!-- Bottom Left: DATA -->
  <path d="M 370 260 C 300 280 260 320 210 330" fill="none" stroke="#D1C4B2" stroke-width="2.5" />
  <path d="M 370 260 C 300 280 260 320 210 330" fill="none" stroke="#7A9A6D" stroke-width="1.8" class="flow-pulse-2" />

  <!-- Bottom Right: ENGINEERING -->
  <path d="M 550 260 C 620 280 660 320 710 330" fill="none" stroke="#D1C4B2" stroke-width="2.5" />
  <path d="M 550 260 C 620 280 660 320 710 330" fill="none" stroke="#7A9A6D" stroke-width="1.8" class="flow-pulse-1" />

  <!-- ==================== CENTRAL NODE: RAHUL.DEV / AI + FULL-STACK ==================== -->
  <g transform="translate(360, 165)">
    <!-- Hub Card: Espresso Brown with Sage Green Border -->
    <rect width="200" height="130" rx="16" fill="url(#cardBg)" stroke="#7A9A6D" stroke-width="1.8" />

    <!-- Center Icon / Emblem -->
    <circle cx="100" cy="36" r="14" fill="#384E31" stroke="#88A57B" stroke-width="1.2" />
    <text x="100" y="40" text-anchor="middle" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">&lt;/&gt;</text>

    <text x="100" y="70" text-anchor="middle" fill="#F6F1EA" font-family="'JetBrains Mono', sans-serif" font-size="15" font-weight="800" letter-spacing="1">RAHUL.DEV</text>
    <rect x="25" y="80" width="150" height="22" rx="4" fill="#3D5036" stroke="#7A9A6D" stroke-width="0.8" />
    <text x="100" y="95" text-anchor="middle" fill="#D3E5CF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.5">AI + FULL-STACK</text>
    <text x="100" y="118" text-anchor="middle" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="8.5" letter-spacing="1">CENTRAL_NEXUS</text>
  </g>

  <!-- ==================== QUADRANT 1: AI / CODE ==================== -->
  <g transform="translate(40, 65)">
    <rect width="220" height="135" rx="12" fill="url(#cardBg)" stroke="#4A3A2F" stroke-width="1" />
    <text x="18" y="27" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Languages</text>
    <circle cx="196" cy="23" r="4" fill="#7A9A6D" />

    <!-- Python -->
    <g transform="translate(16, 46)">
      <rect width="188" height="32" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="16" r="3.5" fill="#7A9A6D" />
      <text x="32" y="20" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Python</text>
      <text x="172" y="20" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="9">AI / LLMs</text>
    </g>

    <!-- Java -->
    <g transform="translate(16, 86)">
      <rect width="188" height="32" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="16" r="3.5" fill="#E8B04C" />
      <text x="32" y="20" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Java</text>
      <text x="172" y="20" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="9">OOP / Core</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: WEB / UI ==================== -->
  <g transform="translate(660, 65)">
    <rect width="220" height="155" rx="12" fill="url(#cardBg)" stroke="#4A3A2F" stroke-width="1" />
    <text x="18" y="27" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Frameworks</text>
    <circle cx="196" cy="23" r="4" fill="#7A9A6D" />

    <!-- TypeScript -->
    <g transform="translate(16, 44)">
      <rect width="188" height="30" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="15" r="3.5" fill="#88A57B" />
      <text x="32" y="19" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">TypeScript</text>
    </g>

    <!-- HTML -->
    <g transform="translate(16, 80)">
      <rect width="188" height="30" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="15" r="3.5" fill="#D5C8B8" />
      <text x="32" y="19" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">HTML</text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(16, 116)">
      <rect width="188" height="30" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="15" r="3.5" fill="#7A9A6D" />
      <text x="32" y="19" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Tailwind CSS</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: DATA ==================== -->
  <g transform="translate(40, 265)">
    <rect width="220" height="145" rx="12" fill="url(#cardBg)" stroke="#4A3A2F" stroke-width="1" />
    <text x="18" y="27" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Databases</text>
    <circle cx="196" cy="23" r="4" fill="#7A9A6D" />

    <!-- MySQL -->
    <g transform="translate(16, 48)">
      <rect width="188" height="34" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="17" r="3.5" fill="#7A9A6D" />
      <text x="32" y="21" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">MySQL</text>
      <text x="172" y="21" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="9">Relational</text>
    </g>

    <!-- DBMS -->
    <g transform="translate(16, 92)">
      <rect width="188" height="34" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="17" r="3.5" fill="#88A57B" />
      <text x="32" y="21" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">DBMS</text>
      <text x="172" y="21" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="9">Normalized</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: ENGINEERING ==================== -->
  <g transform="translate(660, 265)">
    <rect width="220" height="155" rx="12" fill="url(#cardBg)" stroke="#4A3A2F" stroke-width="1" />
    <text x="18" y="27" fill="#C5DAC0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Tools</text>
    <circle cx="196" cy="23" r="4" fill="#7A9A6D" />

    <!-- Git -->
    <g transform="translate(16, 44)">
      <rect width="188" height="30" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="15" r="3.5" fill="#E26D5C" />
      <text x="32" y="19" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Git</text>
      <text x="172" y="19" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="8.5">VCS</text>
    </g>

    <!-- DSA -->
    <g transform="translate(16, 80)">
      <rect width="188" height="30" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="15" r="3.5" fill="#7A9A6D" />
      <text x="32" y="19" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">DSA</text>
      <text x="172" y="19" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="8.5">Algorithms</text>
    </g>

    <!-- SDLC -->
    <g transform="translate(16, 116)">
      <rect width="188" height="30" rx="6" fill="#1C1510" stroke="#3E2E23" stroke-width="0.8" />
      <circle cx="18" cy="15" r="3.5" fill="#88A57B" />
      <text x="32" y="19" fill="#F6F1EA" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">SDLC</text>
      <text x="172" y="19" text-anchor="end" fill="#887668" font-family="'JetBrains Mono', monospace" font-size="8.5">Architecture</text>
    </g>
  </g>
</svg>