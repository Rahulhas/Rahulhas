<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="45%" stop-color="#091226" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#1E3A8A" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38BDF8" fill-opacity="0.08" />
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.025" />
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.015" />
    </pattern>

    <style>
      .pulsing-grid {
        animation: pulse-ambient 8s ease-in-out infinite alternate;
      }
      .flowing-line {
        stroke-dasharray: 8 16;
        animation: flow 12s linear infinite;
      }
      .flowing-line-reverse {
        stroke-dasharray: 6 14;
        animation: flow-rev 10s linear infinite;
      }
      @keyframes pulse-ambient {
        0% { opacity: 0.7; }
        100% { opacity: 1; }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flow-rev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Ambient Glows -->
  <rect width="1200" height="400" fill="url(#cyanGlow)" rx="16" />
  <rect width="1200" height="400" fill="url(#blueGlow)" rx="16" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="400" fill="url(#techGrid)" rx="16" class="pulsing-grid" />
  <rect width="1200" height="400" fill="url(#scanlines)" rx="16" />

  <!-- Flowing Data Beams -->
  <path d="M 0 140 Q 350 110 650 160 T 1200 130" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.3" class="flowing-line" />
  <path d="M 0 280 Q 400 310 800 250 T 1200 290" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.22" class="flowing-line-reverse" />

  <!-- Outer Glass Frame & Subtle Borders -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.18" />
  <rect x="6" y="6" width="1188" height="388" rx="11" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08" />

  <!-- Technical Corner Brackets -->
  <path d="M 2 24 L 2 2 L 24 2" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1198 24 L 1198 2 L 1176 2" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 2 376 L 2 398 L 24 398" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1198 376 L 1198 398 L 1176 398" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtle Coordinate Markers -->
  <text x="32" y="32" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="2">SYS_BACKPLANE // SEC_01 // 60HZ</text>
  <text x="1168" y="32" text-anchor="end" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1.5">TELEMETRY: STABLE</text>
  <text x="32" y="380" fill="#475569" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">RAHULHAS // REPOSITORY_CONTEXT_LAYER</text>
  <text x="1168" y="380" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="1">CORE_ENGINE: ACTIVE</text>
</svg>
